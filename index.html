        <span>Phone</span>
      </button>
      <div id="phone-details" class="details" hidden>
        <div class="detail-value">09046870221</div>
        <div class="detail-actions">
          <a class="action" href="tel:09046870221">Call</a>
          <button class="action" type="button" data-copy="09046870221">Copy</button>
        </div>
      </div>

      <a class="card link-card" href="https://instagram.com/omid_.slm" target="_blank" rel="noopener">
        <span>Instagram</span>
      </a>

      <a class="card link-card" href="https://t.me/Omid_st116" target="_blank" rel="noopener">
        <span>Telegram</span>
      </a>

      <a class="card link-card" href="https://eitaa.com/Omid_st116" target="_blank" rel="noopener">
        <span>Eitaa</span>
      </a>

      <a class="card link-card" href="mailto:omidsalem113@gmail.com">
        <span>Email</span>
      </a>

      <button class="card reveal-card" type="button" data-target="emergency-details">
        <span>Emergency Contact</span>
      </button>
      <div id="emergency-details" class="details" hidden>
        <div class="contact-name">Alireza Salem</div>
        <div class="detail-value">09132768702</div>
        <div class="detail-actions">
          <a class="action" href="tel:09132768702">Call</a>
        </div>
      </div>

      <button class="card link-card" id="save-contact" type="button">
        <span>Save Contact</span>
      </button>
    </section>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark and light mode">
      <span id="theme-label">Light Mode</span>
    </button>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
