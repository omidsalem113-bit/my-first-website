<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Omid Salem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
      <span id="themeLabel">Light</span>
    </button>

    <section class="profile">
      <h1>Omid Salem</h1>
      <img class="profile-photo" src="profile.jpg" alt="Omid Salem">
    </section>

    <section class="cards" aria-label="Contact information">

      <article class="card expandable" id="phoneCard">
        <button class="card-head" type="button" aria-expanded="false">
          <span>Phone</span>
          <span class="tap-hint">Tap to reveal</span>
        </button>
        <div class="card-content">
          <div class="value">09046870221</div>
          <div class="actions">
            <a class="action" href="tel:09046870221">Call</a>
            <button class="action" id="copyPhone" type="button">Copy</button>
          </div>
        </div>
      </article>

      <a class="card link-card" href="https://instagram.com/omid_.slm" target="_blank" rel="noopener">
        <span>Instagram</span>
        <span class="tap-hint">Open</span>
      </a>

      <a class="card link-card" href="https://t.me/Omid_st116" target="_blank" rel="noopener">
        <span>Telegram</span>
        <span class="tap-hint">Open</span>
      </a>

      <a class="card link-card" href="https://eitaa.com/Omid_st116" target="_blank" rel="noopener">
        <span>Eitaa</span>
        <span class="tap-hint">Open</span>
      </a>

      <a class="card link-card" href="mailto:omidsalem113@gmail.com">
        <span>Email</span>
        <span class="tap-hint">Open</span>
      </a>

      <article class="card expandable" id="emergencyCard">
        <button class="card-head" type="button" aria-expanded="false">
          <span>Emergency Contact</span>
          <span class="tap-hint">Tap to reveal</span>
        </button>
        <div class="card-content">
          <div class="value">Alireza Salem</div>
          <div class="subvalue">09132768702</div>
          <div class="actions">
            <a class="action" href="tel:09132768702">Call</a>
          </div>
        </div>
      </article>

      <button class="card save-card" id="saveContact" type="button">
        <span>Save Contact</span>
        <span class="tap-hint">Download</span>
      </button>

    </section>

    <footer>Digital NFC Card</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
