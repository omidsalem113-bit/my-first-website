    :root {
      --font: "Jakarta", "Vazirmatn", system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    html[lang="fa"] {
      --font: "Vazirmatn", "Jakarta", system-ui, "Segoe UI", Tahoma, sans-serif;
    }

    /* زمینه‌ی تقریباً خنثی، فقط یک رنگ تأکید (همون آبی) */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #060B0D;
      --surface: #0E1619;
      --line: rgba(242, 250, 252, 0.12);
      --ink: #F2FAFC;
      --muted: #93A9B0;
      --accent: #22E3F5;
      --accent-ink: #22E3F5;
      --on-accent: #031317;
      --backdrop: rgba(0, 0, 0, 0.62);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #F4F8F9;
      --surface: #FFFFFF;
      --line: rgba(10, 26, 32, 0.12);
      --ink: #0A1A20;
      --muted: #51707A;
      --accent: #22D3EE;
      --accent-ink: #0A7F99;
      --on-accent: #031317;
      --backdrop: rgba(10, 26, 32, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    ::selection { background: var(--accent); color: var(--on-accent); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .page {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: 20px 20px calc(48px + env(safe-area-inset-bottom));
    }

    /* ورود: یک حرکت کوتاه و پشت‌سرهم */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes slideUp {
      from { transform: translateY(110%); }
      to   { transform: none; }
    }
    .rise {
      animation: rise 0.6s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 70ms + 220ms);
    }

    /* سوییچ‌ها: زبان بالا چپ، تم بالا راست (در هر دو زبان چپ و راست فیزیکی) */
    .bar { position: relative; height: 42px; }

    .toggle {
      position: absolute;
      top: 0;
      width: 84px;
      height: 42px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .toggle.lang  { left: 0; }
    .toggle.theme { right: 0; }

    .toggle .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      transition: transform 0.25s var(--ease);
    }
    :root[data-theme="dark"] .toggle.theme .knob { transform: translateX(42px); }
    :root[lang="fa"] .toggle.lang .knob { transform: translateX(42px); }

    .toggle svg {
      position: absolute;
      top: 11px;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .toggle .sun  { left: 11px; }
    .toggle .moon { right: 11px; }
    :root[data-theme="light"] .toggle .sun,
    :root[data-theme="dark"] .toggle .moon { stroke: var(--on-accent); }

    .toggle .lbl {
      position: absolute;
      top: 0;
      width: 42px;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      color: var(--muted);
    }
    .toggle .lbl.l { left: 0; font-family: "Jakarta", system-ui, sans-serif; }
    .toggle .lbl.r { right: 0; font-family: "Vazirmatn", Tahoma, sans-serif; }
    :root[lang="en"] .toggle .lbl.l,
    :root[lang="fa"] .toggle .lbl.r { color: var(--on-accent); }

    /* اسم و عکس */
    .hero {
      --fs: clamp(54px, 17vw, 76px);              /* اندازه‌ی فونت اسم؛ عکس از روی همین محاسبه می‌شود */
      container-type: inline-size;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 32px 0 28px;
    }

    .name {
      min-width: 0;
      margin: 0;
      font-weight: 800;
      font-size: var(--fs);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    html[lang="fa"] .name { font-weight: 700; line-height: 1.15; letter-spacing: 0; position: relative; top: -0.06em; }

    @media (max-width: 340px) { .hero { gap: 10px; } }   /* گوشی‌های خیلی باریک */

    .name .ln { display: block; overflow: hidden; padding-block: 0.06em; margin-block: -0.06em; }
    .name .ln > span {
      display: block;
      animation: slideUp 0.8s var(--ease) both;
      animation-delay: calc(var(--j, 0) * 90ms + 100ms);
    }

    .avatar {
      flex: none;
      width: calc(var(--fs) * var(--k, 1.95));   /* هم‌قد دو خط اسم */
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
      display: grid;
      place-items: center;
    }
    html[lang="fa"] .avatar { --k: 2.1; }

    /* فارسی: اسم باریک‌تر از انگلیسی است، پس اندازه را طوری می‌گیریم که
       عکس و اسم کل عرض را پر کنند (بدون جای خالی وسط و بدون کج‌شدن به راست) */
    html[lang="fa"] .hero { --fs: clamp(54px, calc((min(100vw, 480px) - 56px) / 4.25), 96px); }
    @supports (font-size: 1cqw) {
      html[lang="fa"] .hero { --fs: clamp(54px, calc((100cqw - 16px) / 4.25), 96px); }
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar.noimg img { display: none; }
    .avatar.noimg::after {
      content: attr(data-initials);
      font-weight: 800;
      font-size: calc(var(--fs) * 0.6);
      color: var(--accent-ink);
    }

    /* دکمه‌ها */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 56px;
      padding: 0 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 16.5px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s var(--ease), border-color 0.2s, filter 0.2s;
    }
    .btn:hover { border-color: var(--accent-ink); }
    .btn:active { transform: scale(0.98); }
    .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
    .btn.primary:hover { filter: brightness(1.06); }
    .btn.sm { height: 46px; border-radius: 14px; font-size: 15px; }
    .btn svg {
      flex: none;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* شبکه‌های اجتماعی */
    .socials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 16px 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      text-align: center;
      text-decoration: none;
      transition: transform 0.15s var(--ease), border-color 0.2s;
    }
    .tile:hover { border-color: var(--accent-ink); }
    .tile:active { transform: scale(0.98); }
    .tile svg {
      width: 26px;
      height: 26px;
      margin-bottom: 2px;
      fill: none;
      stroke: var(--accent-ink);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .t-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .t-handle {
      max-width: 100%;
      direction: ltr;
      unicode-bidi: isolate;
      font-size: 12px;
      line-height: 1.3;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    /* شماره و ایمیل: خط ساده با دکمه‌ی کپی */
    .details { margin-top: 28px; border-top: 1px solid var(--line); }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .rtext { min-width: 0; }
    .rlabel { display: block; font-size: 13px; color: var(--muted); }
    .val {
      display: inline-block;
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    a.val:hover { color: var(--accent-ink); }

    .icon-btn {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent-ink); }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-btn.done { color: var(--accent-ink); border-color: var(--accent-ink); }
    .icon-btn.done .i-copy { display: none; }
    .icon-btn:not(.done) .i-check { display: none; }

    /* ابزارها */
    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }

    /* تماس اضطراری: بخش آرام و جدا در پایین */
    .emergency { margin-top: 40px; border-top: 1px solid var(--line); }
    .disclosure {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 14px 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 15px;
      text-align: start;
      cursor: pointer;
    }
    .em-title { font-weight: 600; }
    .em-side { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
    .disclosure .chev {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.25s var(--ease);
    }
    .emergency.open .chev { transform: rotate(180deg); }

    .em-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s var(--ease);
    }
    .emergency.open .em-panel { grid-template-rows: 1fr; }
    .em-inner {
      min-height: 0;
      overflow: hidden;
      visibility: hidden;
      transition: visibility 0s linear 0.25s;
    }
    .emergency.open .em-inner { visibility: visible; transition-delay: 0s; }
    .em-content { padding: 2px 0 18px; }
    .em-who { margin: 0; font-size: 16px; font-weight: 600; }
    .em-num { margin: 2px 0 14px; font-size: 24px; font-weight: 800; letter-spacing: 0.02em; }
    .em-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* پنجره‌ی QR */
    dialog {
      width: min(88vw, 340px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      color: var(--ink);
    }
    dialog::backdrop { background: var(--backdrop); }
    .dlg-body { padding: 22px; text-align: center; }
    .dlg-body h2 { margin: 0 0 16px; font-size: 17px; font-weight: 700; line-height: 1.5; }
    .qr { border-radius: 16px; overflow: hidden; background: #FFFFFF; margin-bottom: 18px; }
    .qr svg { display: block; width: 100%; height: auto; }
    .dlg-body .btn { width: 100%; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font-size: 15px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent-ink);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bar">
      <button class="toggle lang" id="langBtn" type="button">
        <span class="knob"></span>
        <span class="lbl l" aria-hidden="true">EN</span>
        <span class="lbl r" lang="fa" aria-hidden="true">فا</span>
      </button>

      <button class="toggle theme" id="themeBtn" type="button">
        <span class="knob"></span>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </div>

    <main>
      <section class="hero">
        <h1 class="name">
          <span class="ln"><span id="n1" style="--j:0"></span></span>
          <span class="ln"><span id="n2" style="--j:1"></span></span>
        </h1>
        <div class="avatar rise" id="avatar" style="--i:2"><img id="photo" alt=""></div>
      </section>

      <section class="actions rise" style="--i:3">
        <a class="btn primary" id="callBtn" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg>
          <span data-t="call"></span>
        </a>
        <button class="btn" id="saveBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>
          <span data-t="save"></span>
        </button>
      </section>

      <section class="socials rise" style="--i:4">
        <a class="tile" id="igLink" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          <span class="t-name" data-t="instagram"></span>
          <span class="t-handle" id="igHandle"></span>
        </a>
        <a class="tile" id="tgLink" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          <span class="t-name" data-t="telegram"></span>
          <span class="t-handle" id="tgHandle"></span>
        </a>
        <a class="tile" id="etLink" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"></path></svg>
          <span class="t-name" data-t="eitaa"></span>
          <span class="t-handle" id="etHandle"></span>
        </a>
      </section>

      <section class="details rise" style="--i:5">
        <div class="row">
          <div class="rtext">
            <span class="rlabel" data-t="phone"></span>
            <bdi class="val" id="phoneVal" dir="ltr"></bdi>
          </div>
          <button class="icon-btn" type="button" data-copy="phone" data-aria="copyPhone">
            <svg class="i-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <svg class="i-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
          </button>
        </div>
        <div class="row">
          <div class="rtext">
            <span class="rlabel" data-t="email"></span>
            <a class="val" id="emailVal" dir="ltr"></a>
          </div>
          <button class="icon-btn" type="button" data-copy="email" data-aria="copyEmail">
            <svg class="i-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <svg class="i-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
          </button>
        </div>
      </section>

      <section class="tools rise" style="--i:6">
        <button class="btn sm" id="qrBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"></path></svg>
          <span data-t="qr"></span>
        </button>
        <button class="btn sm" id="shareBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
          <span data-t="share"></span>
        </button>
      </section>

      <section class="emergency rise" id="emergency" style="--i:7">
        <button class="disclosure" id="emToggle" type="button" aria-expanded="false" aria-controls="emBody">
          <span class="em-title" data-t="emergency"></span>
          <span class="em-side">
            <span id="emHint"></span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </span>
        </button>
        <div class="em-panel" id="emBody">
          <div class="em-inner">
            <div class="em-content">
              <p class="em-who" id="emWho"></p>
              <p class="em-num"><bdi id="emNum" dir="ltr"></bdi></p>
              <div class="em-actions">
                <a class="btn sm primary" id="emCall" href="#"><span data-t="call"></span></a>
                <button class="btn sm" id="emCopy" type="button"><span id="emCopyLbl"></span></button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="qrDlg" aria-labelledby="qrTitle">
    <div class="dlg-body">
      <h2 id="qrTitle" data-t="qrTitle"></h2>
      <div class="qr" id="qrBox"></div>
      <button class="btn sm" id="qrClose" type="button" data-t="close"></button>
    </div>
  </dialog>

  <div class="toast" id="toast" aria-hidden="true"></div>
  <div class="sr-only" id="status" role="status" aria-live="polite"></div>

  <script>
    /* ====== اطلاعات کارت: فقط همین دو بخش را ویرایش کن ====== */

    // ۱) اطلاعات مشترک بین دو زبان
    const CARD = {
      photo: "photo.jpg",
      phone: "09046870221",
      email: "omidsalem113@gmail.com",
      instagram: "omid_.slm",
      telegram: "Omid_st116",
      eitaa: "Omid_st116",
      emergencyPhone: "09132768702"
    };

    // ۲) متن‌ها به تفکیک زبان
    const TEXT = {
      en: {
        given: "Omid", family: "Salem", initials: "OS",
        emergencyWho: "Alireza Salem (Father)",
        ui: {
          call: "Call", save: "Save contact",
          phone: "Phone", email: "Email",
          instagram: "Instagram", telegram: "Telegram", eitaa: "Eitaa",
          emergency: "Emergency contact", reveal: "Tap to reveal", hide: "Hide",
          copy: "Copy", copied: "Copied", copyFailed: "Copy failed",
          copiedSr: "Copied", copyFailedSr: "Copy failed. Select the text and copy it manually.",
          copyPhone: "Copy phone number", copyEmail: "Copy email address",
          qr: "QR code", share: "Share", linkCopied: "Link copied",
          qrTitle: "Scan to open this card", close: "Close",
          themeLabel: "Switch between light and dark theme",
          langLabel: "Switch language to Persian"
        }
      },
      fa: {
        given: "امید", family: "سالم", initials: "اس",
        emergencyWho: "علیرضا سالم (پدر)",
        ui: {
          call: "تماس", save: "ذخیره مخاطب",
          phone: "تلفن", email: "ایمیل",
          instagram: "اینستاگرام", telegram: "تلگرام", eitaa: "ایتا",
          emergency: "تماس اضطراری", reveal: "برای نمایش لمس کنید", hide: "پنهان کردن",
          copy: "کپی", copied: "کپی شد", copyFailed: "کپی نشد",
          copiedSr: "کپی شد", copyFailedSr: "کپی نشد. متن را انتخاب کنید و دستی کپی کنید.",
          copyPhone: "کپی شماره تلفن", copyEmail: "کپی ایمیل",
          qr: "کد QR", share: "اشتراک‌گذاری", linkCopied: "لینک کپی شد",
          qrTitle: "برای باز کردن این کارت اسکن کنید", close: "بستن",
          themeLabel: "تغییر بین حالت روشن و تیره",
          langLabel: "تغییر زبان به انگلیسی"
        }
      }
    };
    /* ======================================================== */

    const root = document.documentElement;
    const $ = id => document.getElementById(id);
    let lang = root.getAttribute("lang") === "fa" ? "fa" : "en";
    let T = TEXT[lang];

    const digits = s => s.replace(/\D/g, "");
    const intl = s => "+98" + digits(s).replace(/^0/, "");                 // 0904… → +98904…
    const pretty = s => digits(s).replace(/^(\d{4})(\d{3})(\d{4})$/, "$1 $2 $3");
    const fullName = () => T.given + " " + T.family;
    const pageUrl = () => /^https?:/.test(location.protocol) ? location.origin + location.pathname : location.href;

    // پیام برای صفحه‌خوان‌ها و پیام کوتاه روی صفحه
    function say(msg) {
      const el = $("status");
      el.textContent = "";
      setTimeout(() => { el.textContent = msg; }, 50);
    }
    let toastTimer;
    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    // کپی در کلیپ‌بورد (با راه‌حل جایگزین برای مرورگرهای قدیمی)
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) { /* ادامه با روش جایگزین */ }
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
        document.body.append(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        return ok;
      } catch (e) {
        return false;
      }
    }

    // اگر کپی نشد، متن را انتخاب می‌کنیم تا کاربر دستی کپی کند
    function selectNode(el) {
      const r = document.createRange();
      r.selectNodeContents(el);
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }

    // مقدارهای ثابت (شماره، ایمیل، آیدی‌ها و لینک‌ها)
    function fill() {
      $("callBtn").href = "tel:" + intl(CARD.phone);
      $("phoneVal").textContent = pretty(CARD.phone);
      $("emailVal").textContent = CARD.email;
      $("emailVal").href = "mailto:" + CARD.email;

      $("igLink").href = "https://instagram.com/" + CARD.instagram;
      $("tgLink").href = "https://t.me/" + CARD.telegram;
      $("etLink").href = "https://eitaa.com/" + CARD.eitaa;
      $("igHandle").textContent = "@" + CARD.instagram;
      $("tgHandle").textContent = "@" + CARD.telegram;
      $("etHandle").textContent = "@" + CARD.eitaa;

      $("emNum").textContent = pretty(CARD.emergencyPhone);
      $("emCall").href = "tel:" + intl(CARD.emergencyPhone);
    }

    // تماس اضطراری (بسته می‌ماند تا کاربر باز کند)
    const emSection = $("emergency");
    function syncEmergency() {
      const open = emSection.classList.contains("open");
      $("emToggle").setAttribute("aria-expanded", String(open));
      $("emHint").textContent = open ? T.ui.hide : T.ui.reveal;
    }
    $("emToggle").addEventListener("click", () => {
      emSection.classList.toggle("open");
      syncEmergency();
    });

    let emTimer;
    $("emCopy").addEventListener("click", async () => {
      const ok = await copyText(digits(CARD.emergencyPhone));
      say(ok ? T.ui.copiedSr : T.ui.copyFailedSr);
      $("emCopyLbl").textContent = ok ? T.ui.copied : T.ui.copyFailed;
      if (!ok) selectNode($("emNum"));
      clearTimeout(emTimer);
      emTimer = setTimeout(() => { $("emCopyLbl").textContent = T.ui.copy; }, 1800);
    });

    // دکمه‌های کپی شماره و ایمیل
    document.querySelectorAll("[data-copy]").forEach(btn => {
      let timer;
      btn.addEventListener("click", async () => {
        const kind = btn.dataset.copy;
        const value = { phone: digits(CARD.phone), email: CARD.email }[kind];
        const ok = await copyText(value);
        say(ok ? T.ui.copiedSr : T.ui.copyFailedSr);
        if (ok) {
          btn.classList.add("done");
          clearTimeout(timer);
          timer = setTimeout(() => btn.classList.remove("done"), 1600);
        } else {
          toast(T.ui.copyFailed);
          selectNode($(kind + "Val"));
        }
      });
    });

    // ذخیره در مخاطبین (فایل vCard با شماره، ایمیل، لینک‌ها و عکس)
    function photoBase64() {
      try {
        const img = $("photo");
        if (!img.complete || !img.naturalWidth) return null;
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        c.getContext("2d").drawImage(img, 0, 0, 256, 256);
        return c.toDataURL("image/jpeg", 0.85).split(",")[1];
      } catch (e) {
        return null;                              // اگر مرورگر اجازه نداد، مخاطب بدون عکس ذخیره می‌شود
      }
    }
    const esc = s => String(s).replace(/([,;\\])/g, "\\$1");
    function fold(line) {
      const out = [line.slice(0, 75)];
      for (let i = 75; i < line.length; i += 74) out.push(" " + line.slice(i, i + 74));
      return out.join("\r\n");
    }
    function buildVCard() {
      const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:" + esc(T.family) + ";" + esc(T.given) + ";;;",
        "FN:" + esc(fullName()),
        "TEL;TYPE=CELL:" + intl(CARD.phone),
        "EMAIL;TYPE=INTERNET:" + CARD.email,
        "URL:https://instagram.com/" + CARD.instagram,
        "URL:https://t.me/" + CARD.telegram,
        "URL:https://eitaa.com/" + CARD.eitaa
      ];
      const photo = photoBase64();
      if (photo) lines.push(fold("PHOTO;ENCODING=b;TYPE=JPEG:" + photo));
      lines.push("END:VCARD");
      return lines.join("\r\n");
    }
    $("saveBtn").addEventListener("click", () => {
      const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Omid-Salem.vcf";
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    // کد QR از آدرس همین صفحه (با حاشیه‌ی سفید استاندارد)
    function qrSvg(text) {
      const q = qrcode(0, "M");
      q.addData(text);
      q.make();
      const n = q.getModuleCount();
      const m = 4;
      let d = "";
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          if (q.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
        }
      }
      const s = n + m * 2;
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + (-m) + " " + (-m) + " " + s + " " + s +
        '" shape-rendering="crispEdges" role="img" aria-label="QR">' +
        '<rect x="' + (-m) + '" y="' + (-m) + '" width="' + s + '" height="' + s + '" fill="#FFFFFF"/>' +
        '<path d="' + d + '" fill="#0A1A20"/></svg>';
    }
    const dlg = $("qrDlg");
    const closeDlg = () => { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); };
    $("qrBtn").addEventListener("click", () => {
      $("qrBox").innerHTML = qrSvg(pageUrl());
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    });
    $("qrClose").addEventListener("click", closeDlg);
    dlg.addEventListener("click", e => { if (e.target === dlg) closeDlg(); });

    // اشتراک‌گذاری (اگر مرورگر پشتیبانی نکند، لینک کپی می‌شود)
    $("shareBtn").addEventListener("click", async () => {
      const url = pageUrl();
      if (navigator.share) {
        try { await navigator.share({ title: fullName(), url: url }); } catch (e) { /* کاربر لغو کرد */ }
        return;
      }
      const ok = await copyText(url);
      toast(ok ? T.ui.linkCopied : T.ui.copyFailed);
    });

    // رندر متن‌ها (با هر بار تغییر زبان دوباره اجرا می‌شود)
    function render() {
      T = TEXT[lang];
      root.setAttribute("lang", lang);
      root.setAttribute("dir", lang === "fa" ? "rtl" : "ltr");
      document.title = fullName();

      $("n1").textContent = T.given;
      $("n2").textContent = T.family;
      $("photo").alt = fullName();
      $("avatar").dataset.initials = T.initials;

      document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T.ui[el.dataset.t]; });
      document.querySelectorAll("[data-aria]").forEach(el => el.setAttribute("aria-label", T.ui[el.dataset.aria]));
      $("langBtn").setAttribute("aria-label", T.ui.langLabel);
      $("themeBtn").setAttribute("aria-label", T.ui.themeLabel);

      $("emWho").textContent = T.emergencyWho;
      $("emCopyLbl").textContent = T.ui.copy;
      syncEmergency();
    }

    // عکس پروفایل
    $("photo").addEventListener("error", () => $("avatar").classList.add("noimg"));
    $("photo").src = CARD.photo;

    // تغییر زبان (انتخاب کاربر برای دفعه‌ی بعد ذخیره می‌شود)
    $("langBtn").addEventListener("click", () => {
      lang = lang === "en" ? "fa" : "en";
      try { localStorage.setItem("lang", lang); } catch (e) {}
      render();
    });

    // تغییر تم (انتخاب کاربر برای دفعه‌ی بعد ذخیره می‌شود)
    const themeColor = document.querySelector('meta[name="theme-color"]');
    function applyTheme(t) {
      root.setAttribute("data-theme", t);
      $("themeBtn").setAttribute("aria-pressed", String(t === "dark"));
      themeColor.setAttribute("content", t === "dark" ? "#060B0D" : "#F4F8F9");
    }
    applyTheme(root.getAttribute("data-theme"));
    $("themeBtn").addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });

    fill();
    render();
  </script>
</body>
</html>
