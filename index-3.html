<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Omid Salem</title>
  <meta name="description" content="Omid Salem, contact card">
  <meta name="theme-color" content="#030D10">
  <meta property="og:title" content="Omid Salem">
  <meta property="og:description" content="Contact card">
  <meta property="og:type" content="website">

  <!-- تم و زبان ذخیره‌شده‌ی بازدیدکننده را قبل از رندر اعمال می‌کنیم تا صفحه چشمک نزند -->
  <script>
    (function () {
      var root = document.documentElement;
      var theme = null, lang = null;
      try { theme = localStorage.getItem("theme"); lang = localStorage.getItem("lang"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      if (lang !== "fa" && lang !== "en") {
        lang = /^fa/i.test(navigator.language || "") ? "fa" : "en";
      }
      root.setAttribute("data-theme", theme);
      root.setAttribute("lang", lang);
      root.setAttribute("dir", lang === "fa" ? "rtl" : "ltr");
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Mulish:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-name: "Cormorant Garamond", Georgia, serif;
      --font-name-fa: "Vazirmatn", Tahoma, system-ui, sans-serif;
      --font-en: "Mulish", "Vazirmatn", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-fa: "Vazirmatn", "Mulish", Tahoma, system-ui, sans-serif;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #FFFFFF;
      --ink: #0B3B4A;
      --sub: #1A7C92;
      --name: #0A8CA8;
      --name-glow: none;
      --accent: #22D3EE;
      --on-accent: #04252C;
      --card-bg: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, rgba(165,243,252,0.42) 100%);
      --card-border: rgba(34, 211, 238, 0.55);
      --card-shadow: 0 10px 28px rgba(34, 211, 238, 0.22), inset 0 1px 0 rgba(255,255,255,0.9);
      --card-shadow-hover: 0 14px 34px rgba(34, 211, 238, 0.34), inset 0 1px 0 rgba(255,255,255,0.9);
      --arc-fill: linear-gradient(135deg, rgba(34,211,238,0.34), rgba(34,211,238,0.05));
      --arc-line: rgba(34, 211, 238, 0.55);
      --arc-glow: none;
      --avatar-ring: transparent;
      --avatar-shadow: 0 12px 30px rgba(10, 60, 80, 0.22);
      --toggle-bg: rgba(255,255,255,0.9);
      --toggle-border: rgba(34, 211, 238, 0.35);
      --toggle-shadow: 0 6px 18px rgba(34, 211, 238, 0.2);
      --knob: #8EEBF5;
      --icon: #0B3B4A;
      --icon-active: #0B3B4A;
      --footer: #5E8F9C;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #030D10;
      --ink: #EAFBFF;
      --sub: #4FD3E4;
      --name: #22E3F5;
      --name-glow: 0 0 22px rgba(34, 227, 245, 0.45);
      --accent: #22E3F5;
      --on-accent: #04252C;
      --card-bg: linear-gradient(135deg, #07303A 0%, #052029 100%);
      --card-border: #15BFD6;
      --card-shadow: 0 0 22px rgba(21, 191, 214, 0.28);
      --card-shadow-hover: 0 0 30px rgba(34, 227, 245, 0.5);
      --arc-fill: transparent;
      --arc-line: rgba(34, 227, 245, 0.55);
      --arc-glow: 0 0 14px rgba(34, 227, 245, 0.35);
      --avatar-ring: #22E3F5;
      --avatar-shadow: 0 0 26px rgba(34, 227, 245, 0.4);
      --toggle-bg: #07242B;
      --toggle-border: rgba(34, 227, 245, 0.3);
      --toggle-shadow: none;
      --knob: #22E3F5;
      --icon: #EAFBFF;
      --icon-active: #04252C;
      --footer: #22E3F5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-en);
      font-size: 16px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }
    html[lang="fa"] body { font-family: var(--font-fa); line-height: 1.7; }

    ::selection { background: var(--accent); color: var(--on-accent); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* قوس‌های گوشه */
    .arc {
      position: fixed;
      width: 420px;
      height: 420px;
      pointer-events: none;
      z-index: 0;
    }
    .arc::before,
    .arc::after { content: ""; position: absolute; border-radius: 50%; }
    .arc::before { inset: 0; background: var(--arc-fill); }
    .arc::after  { inset: -28px; border: 1px solid var(--arc-line); box-shadow: var(--arc-glow); }
    .arc.tl { top: -200px; left: -200px; }
    .arc.br { bottom: -200px; right: -200px; }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 24px 24px 40px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* سوییچ‌ها: زبان بالا چپ، تم بالا راست (در هر دو زبان، چپ و راست فیزیکی) */
    .toggle {
      position: absolute;
      top: 24px;
      width: 84px;
      height: 42px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--toggle-border);
      background: var(--toggle-bg);
      box-shadow: var(--toggle-shadow);
      cursor: pointer;
      color: var(--icon);
    }
    .toggle.lang  { left: 24px; }
    .toggle.theme { right: 24px; }

    .toggle .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--knob);
      transition: transform 0.25s ease;
    }
    :root[data-theme="dark"] .toggle.theme .knob { transform: translateX(42px); }
    :root[lang="fa"] .toggle.lang .knob { transform: translateX(42px); }

    .toggle svg {
      position: absolute;
      top: 11px;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--icon);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .toggle .sun  { left: 11px; }
    .toggle .moon { right: 11px; }
    :root[data-theme="light"] .toggle .sun,
    :root[data-theme="dark"] .toggle .moon { stroke: var(--icon-active); }

    .toggle .lbl {
      position: absolute;
      top: 0;
      width: 42px;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      color: var(--icon);
    }
    .toggle .lbl.l { left: 0; font-family: var(--font-en); }
    .toggle .lbl.r { right: 0; font-family: var(--font-fa); }
    :root[lang="en"] .toggle .lbl.l,
    :root[lang="fa"] .toggle .lbl.r { color: var(--icon-active); }

    /* هدر */
    h1 {
      margin: 74px 0 0;
      text-align: center;
      font-family: var(--font-name);
      font-style: italic;
      font-weight: 600;
      font-size: clamp(44px, 13vw, 58px);
      line-height: 1.2;
      color: var(--name);
      text-shadow: var(--name-glow);
    }
    html[lang="fa"] h1 {
      font-family: var(--font-name-fa);
      font-style: normal;
      font-weight: 600;
      font-size: clamp(38px, 11.5vw, 50px);
      line-height: 1.5;
    }

    .avatar {
      width: 208px;
      height: 208px;
      margin: 30px auto 36px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--avatar-ring);
      box-shadow: var(--avatar-shadow);
      background: var(--card-bg);
      display: grid;
      place-items: center;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar.noimg img { display: none; }
    .avatar.noimg::after {
      content: attr(data-initials);
      font-family: var(--font-name);
      font-style: italic;
      font-weight: 600;
      font-size: 64px;
      color: var(--name);
    }

    /* ردیف‌ها */
    .list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      min-height: 84px;
      padding: 16px 22px;
      border-radius: 26px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      box-shadow: var(--card-shadow);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--ink);
      font: inherit;
      text-align: start;
      text-decoration: none;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .item:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-2px); }
    .item:active { transform: translateY(0); }

    .text { min-width: 0; }
    .title { display: block; font-size: 20px; font-weight: 500; }
    .sub {
      display: block;
      margin-top: 2px;
      font-size: 16px;
      color: var(--sub);
      overflow-wrap: anywhere;
    }
    .sub .line { display: block; }

    .chev {
      flex: none;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--ink);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.25s ease;
    }
    html[dir="rtl"] .chev { transform: scaleX(-1); }

    /* کارت‌های بازشونده (تلفن و تماس اضطراری) */
    .item.reveal {
      display: block;
      padding: 0;
      cursor: auto;
    }
    .reveal .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      min-height: 84px;
      padding: 16px 22px;
      border: 0;
      border-radius: 26px;
      background: none;
      color: inherit;
      font: inherit;
      text-align: start;
      cursor: pointer;
    }
    .reveal.open .chev,
    html[dir="rtl"] .reveal.open .chev { transform: rotate(90deg); }

    .panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
    }
    .reveal.open .panel { grid-template-rows: 1fr; }
    .panel-inner {
      min-height: 0;
      overflow: hidden;
      visibility: hidden;
      transition: visibility 0s linear 0.25s;
    }
    .reveal.open .panel-inner { visibility: visible; transition-delay: 0s; }

    .actions {
      display: flex;
      gap: 10px;
      padding: 2px 22px 20px;
    }
    .btn {
      flex: 1;
      display: grid;
      place-items: center;
      height: 46px;
      padding: 0 12px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: filter 0.2s ease, border-color 0.2s ease;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary {
      background: var(--accent);
      border-color: transparent;
      color: var(--on-accent);
    }
    .btn.primary:hover { filter: brightness(1.08); }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* فوتر */
    footer {
      margin-top: auto;
      padding-top: 48px;
      text-align: center;
      color: var(--footer);
    }
    footer .dash {
      width: 24px;
      height: 1px;
      margin: 0 auto 12px;
      background: currentColor;
      opacity: 0.6;
    }
    footer .foot-name {
      font-size: 14px;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
    }
    /* در حروف فارسی فاصله‌ی بین حروف اتصال را می‌شکند */
    html[lang="fa"] footer .foot-name { letter-spacing: 0; text-indent: 0; font-size: 15px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="arc tl" aria-hidden="true"></div>
  <div class="arc br" aria-hidden="true"></div>

  <div class="page">
    <button class="toggle lang" id="langBtn" type="button">
      <span class="knob"></span>
      <span class="lbl l" aria-hidden="true">EN</span>
      <span class="lbl r" lang="fa" aria-hidden="true">فا</span>
    </button>

    <button class="toggle theme" id="themeBtn" type="button">
      <span class="knob"></span>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>

    <main>
      <h1 id="name"></h1>
      <div class="avatar" id="avatar"><img id="photo" alt=""></div>
      <ul class="list" id="list"></ul>
    </main>

    <footer>
      <div class="dash" aria-hidden="true"></div>
      <div class="foot-name" id="foot"></div>
    </footer>
  </div>

  <div class="sr-only" id="status" role="status" aria-live="polite"></div>

  <script>
    /* ====== اطلاعات کارت: فقط همین دو بخش را ویرایش کن ====== */

    // ۱) اطلاعات مشترک بین دو زبان
    const CARD = {
      photo: "photo.jpg",
      phone: "09046870221",
      email: "omidsalem113@gmail.com",
      instagram: "omid_.slm",
      telegram: "Omid_st116",
      eitaa: "Omid_st116",
      emergencyPhone: "09132768702"
    };

    // ۲) متن‌ها به تفکیک زبان
    const TEXT = {
      en: {
        given: "Omid", family: "Salem", initials: "OS",
        emergencyName: "Alireza Salem (Father)",
        ui: {
          phone: "Phone", instagram: "Instagram", telegram: "Telegram", eitaa: "Eitaa",
          email: "Email", emergency: "Emergency Contact", save: "Save Contact",
          saveSub: "Add to your contacts", reveal: "Tap to reveal",
          call: "Call", copy: "Copy", copied: "Copied", copyFailed: "Copy failed",
          copiedSr: "Number copied", copyFailedSr: "Copy failed. Select the number and copy it manually.",
          themeLabel: "Switch between light and dark theme",
          langLabel: "Switch language to Persian"
        }
      },
      fa: {
        given: "امید", family: "سالم", initials: "اس",
        emergencyName: "علیرضا سالم (پدر)",
        ui: {
          phone: "تلفن", instagram: "اینستاگرام", telegram: "تلگرام", eitaa: "ایتا",
          email: "ایمیل", emergency: "تماس اضطراری", save: "ذخیره مخاطب",
          saveSub: "افزودن به مخاطبین", reveal: "برای نمایش لمس کنید",
          call: "تماس", copy: "کپی", copied: "کپی شد", copyFailed: "کپی نشد",
          copiedSr: "شماره کپی شد", copyFailedSr: "کپی نشد. شماره را انتخاب کنید و دستی کپی کنید.",
          themeLabel: "تغییر بین حالت روشن و تیره",
          langLabel: "تغییر زبان به انگلیسی"
        }
      }
    };
    /* ======================================================== */

    const root = document.documentElement;
    const $ = id => document.getElementById(id);
    let lang = root.getAttribute("lang") === "fa" ? "fa" : "en";
    let T = TEXT[lang];

    const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>';
    const digits = s => s.replace(/\D/g, "");
    const intl = s => "+98" + digits(s).replace(/^0/, "");                     // 0904… → +98904…
    const pretty = s => digits(s).replace(/^(\d{4})(\d{3})(\d{4})$/, "$1 $2 $3");
    const fullName = () => T.given + " " + T.family;

    function say(msg) {
      const el = $("status");
      el.textContent = "";
      setTimeout(() => { el.textContent = msg; }, 50);
    }

    // مقدارهای لاتین (آیدی، ایمیل، شماره) در متن راست‌چین هم چپ‌به‌راست نمایش داده شوند
    function ltr(text) {
      const b = document.createElement("bdi");
      b.dir = "ltr";
      b.textContent = text;
      return b;
    }

    // ردیف ساده (لینک یا دکمه)
    function makeItem(opts) {
      const li = document.createElement("li");
      const el = document.createElement(opts.href ? "a" : "button");
      el.className = "item";
      if (opts.href) {
        el.href = opts.href;
        if (/^https?:/.test(opts.href)) { el.target = "_blank"; el.rel = "noopener noreferrer"; }
      } else {
        el.type = "button";
      }
      el.innerHTML = '<span class="text"><span class="title"></span><span class="sub"></span></span>' + CHEVRON;
      el.querySelector(".title").textContent = opts.title;
      const sub = el.querySelector(".sub");
      if (opts.value) sub.append(ltr(opts.value)); else sub.textContent = opts.sub;
      if (opts.onClick) el.addEventListener("click", opts.onClick);
      li.append(el);
      return li;
    }

    // کپی در کلیپ‌بورد (با راه‌حل جایگزین برای مرورگرهای قدیمی)
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) { /* ادامه با روش جایگزین */ }
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
        document.body.append(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        return ok;
      } catch (e) {
        return false;
      }
    }

    // کارت بازشونده: لمس اول شماره و دکمه‌های Call و Copy را نشان می‌دهد
    function revealItem(opts) {
      const li = document.createElement("li");
      const box = document.createElement("div");
      box.className = "item reveal";

      const head = document.createElement("button");
      head.type = "button";
      head.className = "head";
      head.setAttribute("aria-expanded", "false");
      head.setAttribute("aria-controls", opts.id);
      head.innerHTML = '<span class="text"><span class="title"></span><span class="sub"></span></span>' + CHEVRON;
      head.querySelector(".title").textContent = opts.title;
      const sub = head.querySelector(".sub");
      sub.textContent = T.ui.reveal;

      const panel = document.createElement("div");
      panel.className = "panel";
      panel.id = opts.id;
      const inner = document.createElement("div");
      inner.className = "panel-inner";
      const actions = document.createElement("div");
      actions.className = "actions";

      const call = document.createElement("a");
      call.className = "btn primary";
      call.href = "tel:" + intl(opts.number);
      call.textContent = T.ui.call;

      const copy = document.createElement("button");
      copy.type = "button";
      copy.className = "btn";
      copy.textContent = T.ui.copy;

      let numEl = null;
      let timer;
      copy.addEventListener("click", async () => {
        const ok = await copyText(digits(opts.number));
        copy.textContent = ok ? T.ui.copied : T.ui.copyFailed;
        say(ok ? T.ui.copiedSr : T.ui.copyFailedSr);
        if (!ok && numEl) {                       // اگر کپی نشد، شماره را انتخاب می‌کنیم تا کاربر دستی کپی کند
          const r = document.createRange();
          r.selectNodeContents(numEl);
          const s = getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }
        clearTimeout(timer);
        timer = setTimeout(() => { copy.textContent = T.ui.copy; }, 1800);
      });

      actions.append(call, copy);
      inner.append(actions);
      panel.append(inner);
      box.append(head, panel);

      head.addEventListener("click", () => {
        const open = box.classList.toggle("open");
        head.setAttribute("aria-expanded", String(open));
        sub.textContent = "";
        if (open) {
          if (opts.who) {
            const w = document.createElement("span");
            w.className = "line";
            w.textContent = opts.who;
            sub.append(w);
          }
          const n = document.createElement("span");
          n.className = "line";
          numEl = ltr(pretty(opts.number));
          n.append(numEl);
          sub.append(n);
        } else {
          sub.textContent = T.ui.reveal;
        }
      });

      li.append(box);
      return li;
    }

    // عکس برای فایل مخاطب: کوچک‌شده‌ی عکس صفحه (روی GitHub Pages کار می‌کند)
    function photoBase64() {
      try {
        const img = $("photo");
        if (!img.complete || !img.naturalWidth) return null;
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        c.getContext("2d").drawImage(img, 0, 0, 256, 256);
        return c.toDataURL("image/jpeg", 0.85).split(",")[1];
      } catch (e) {
        return null;                              // اگر مرورگر اجازه نداد، مخاطب بدون عکس ذخیره می‌شود
      }
    }

    const esc = s => String(s).replace(/([,;\\])/g, "\\$1");
    function fold(line) {
      const out = [line.slice(0, 75)];
      for (let i = 75; i < line.length; i += 74) out.push(" " + line.slice(i, i + 74));
      return out.join("\r\n");
    }

    function buildVCard() {
      const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:" + esc(T.family) + ";" + esc(T.given) + ";;;",
        "FN:" + esc(fullName()),
        "TEL;TYPE=CELL:" + intl(CARD.phone),
        "EMAIL;TYPE=INTERNET:" + CARD.email,
        "URL:https://instagram.com/" + CARD.instagram,
        "URL:https://t.me/" + CARD.telegram,
        "URL:https://eitaa.com/" + CARD.eitaa
      ];
      const photo = photoBase64();
      if (photo) lines.push(fold("PHOTO;ENCODING=b;TYPE=JPEG:" + photo));
      lines.push("END:VCARD");
      return lines.join("\r\n");
    }

    function saveContact() {
      const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Omid-Salem.vcf";
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // رندر کل صفحه (هر بار که زبان عوض شود دوباره اجرا می‌شود)
    function render() {
      T = TEXT[lang];
      root.setAttribute("lang", lang);
      root.setAttribute("dir", lang === "fa" ? "rtl" : "ltr");
      document.title = fullName();
      $("name").textContent = fullName();
      $("foot").textContent = fullName();
      $("langBtn").setAttribute("aria-label", T.ui.langLabel);
      $("themeBtn").setAttribute("aria-label", T.ui.themeLabel);

      const avatar = $("avatar");
      avatar.dataset.initials = T.initials;
      $("photo").alt = fullName();

      const list = $("list");
      list.textContent = "";
      list.append(
        revealItem({ id: "p-phone", title: T.ui.phone, number: CARD.phone }),
        makeItem({ title: T.ui.instagram, value: "@" + CARD.instagram, href: "https://instagram.com/" + CARD.instagram }),
        makeItem({ title: T.ui.telegram,  value: "@" + CARD.telegram,  href: "https://t.me/" + CARD.telegram }),
        makeItem({ title: T.ui.eitaa,     value: "@" + CARD.eitaa,     href: "https://eitaa.com/" + CARD.eitaa }),
        makeItem({ title: T.ui.email,     value: CARD.email,           href: "mailto:" + CARD.email }),
        revealItem({ id: "p-emergency", title: T.ui.emergency, number: CARD.emergencyPhone, who: T.emergencyName }),
        makeItem({ title: T.ui.save, sub: T.ui.saveSub, onClick: saveContact })
      );
    }

    // عکس پروفایل
    const photoEl = $("photo");
    photoEl.addEventListener("error", () => $("avatar").classList.add("noimg"));
    photoEl.src = CARD.photo;

    // تغییر زبان (انتخاب کاربر برای دفعه‌ی بعد ذخیره می‌شود)
    $("langBtn").addEventListener("click", () => {
      lang = lang === "en" ? "fa" : "en";
      try { localStorage.setItem("lang", lang); } catch (e) {}
      render();
    });

    // تغییر تم (انتخاب کاربر برای دفعه‌ی بعد ذخیره می‌شود)
    const themeColor = document.querySelector('meta[name="theme-color"]');
    function applyTheme(t) {
      root.setAttribute("data-theme", t);
      $("themeBtn").setAttribute("aria-pressed", String(t === "dark"));
      themeColor.setAttribute("content", t === "dark" ? "#030D10" : "#FFFFFF");
    }
    applyTheme(root.getAttribute("data-theme"));
    $("themeBtn").addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });

    render();
  </script>
</body>
</html>
